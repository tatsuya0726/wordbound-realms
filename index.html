<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070a1f">
<title>LEXI QUEST — Wordbound Realms</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* Layout: one game column — pixel screen on top, status strip, message console (dialogue / quiz / commands), touch pad */
:root{
  --night:#070a1f; --panel:#0c1238; --rule:#e8ebff; --gold:#ffd25e; --text:#f1f2ff; --dim:#97a0d4;
  --good:#7ee08a; --bad:#ff8a8a; --sel:#1f2c7e; --edge:#39407a;
  --font:'DotGothic16','MS Gothic','Osaka-Mono',ui-monospace,monospace;
  color-scheme:dark;
}
html,body{background:var(--night)}
body{color:var(--text);font-family:var(--font);font-size:16px;line-height:1.6}
#app{max-width:760px;margin:0 auto;padding-block:12px 28px;padding-inline:16px;display:flex;flex-direction:column;gap:10px}
#screen{position:relative;border:3px solid var(--rule);border-radius:6px;overflow:hidden;background:#000;box-shadow:0 0 0 3px var(--night),0 0 0 5px var(--edge)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
#cv{position:relative;background:transparent;display:block;width:100%;height:auto;aspect-ratio:480/352;image-rendering:pixelated}
#hud{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;padding:6px 6px 6px 12px;border:2px solid var(--rule);border-radius:6px;background:var(--panel);font-variant-numeric:tabular-nums}
#hudStats{display:flex;flex-wrap:wrap;gap:4px 14px;flex:1;min-width:0}
#hud b{color:var(--gold);font-weight:normal}
.lowhp{color:var(--bad)}
.hbtn{font:inherit;color:var(--text);background:var(--sel);border:2px solid var(--rule);border-radius:4px;padding:2px 12px;cursor:pointer}
.hbtn:focus-visible,.opt:focus-visible,.mini:focus-visible,.pb:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.win{border:3px double var(--rule);border-radius:6px;background:linear-gradient(180deg,#121a52,var(--panel) 40%,#0a0f30);box-shadow:inset 0 0 0 2px #0a0f34,0 6px 18px rgba(0,0,0,.45);padding:12px 14px}
#panel{display:flex;flex-direction:column;gap:8px;min-height:220px}
#log{min-height:96px;max-height:52vh;overflow:auto;overflow-wrap:anywhere}
#opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:4px}
#opts:empty{display:none}
.opt{font:inherit;color:var(--text);background:transparent;border:0;text-align:left;padding:6px 10px 6px 28px;border-radius:4px;cursor:pointer;position:relative;min-height:42px;line-height:1.35}
.opt:hover{background:#151f5c}
.opt.hl{background:var(--sel)}
.opt.hl::before{content:'▶';position:absolute;left:9px;top:8px;color:var(--gold);animation:blink 1s steps(2) infinite}
.opt:disabled{color:#565d90;cursor:not-allowed;background:transparent}
.opt small{display:block;color:var(--dim);font-size:12px}
.opt.next{grid-column:1/-1;text-align:right;color:var(--gold)}
@keyframes blink{50%{opacity:0}}
.who{color:var(--gold);font-size:13px;letter-spacing:.08em;margin-bottom:2px}
.en{font-size:18px;margin:0}
.ja{color:var(--dim);font-size:14px;margin:4px 0 0}
.w{border-bottom:1px dotted var(--gold);cursor:help}
.tools{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.mini{font:inherit;font-size:13px;color:var(--text);background:#141b4e;border:1px solid var(--edge);border-radius:4px;padding:2px 10px;cursor:pointer}
.mini:hover{border-color:var(--gold)}
#tip{margin-top:8px;padding:6px 10px;border:1px solid var(--gold);border-radius:4px;color:var(--gold);font-size:14px}
.qtag{display:inline-block;font-size:12px;letter-spacing:.12em;padding:1px 8px;border-radius:3px;background:var(--gold);color:var(--night);margin-bottom:6px}
.qtag.g{background:#9fd0ff}.qtag.l{background:#ff9fd0}.qtag.c{background:#a6f0b0}.qtag.m{background:#ff9fd0}
.big{font-size:28px;letter-spacing:.04em;color:var(--text)}
.sub{color:var(--dim);font-size:14px}
.blank{color:var(--gold);border-bottom:2px solid var(--gold);padding:0 .4em}
.ok{color:var(--good);font-size:20px}
.ng{color:var(--bad);font-size:20px}
.tipline{color:#cfd5ff;font-size:14px;margin-top:4px}
.spoil{background:#2b3270;color:transparent;border-radius:3px;cursor:pointer;padding:0 4px}
.spoil.open{color:var(--text);background:transparent}
.place{color:var(--gold);font-size:18px}
.place span{color:var(--dim);font-size:13px;margin-left:8px}
.goal{margin-top:6px}
.keys{color:var(--dim);font-size:13px;margin-top:8px}
.nb{width:100%;border-collapse:collapse;font-size:14px}
.nb td{padding:3px 6px;border-bottom:1px solid #222a66;vertical-align:top}
.nb td.n{font-variant-numeric:tabular-nums;color:var(--dim);white-space:nowrap}
.dmg{color:var(--gold)}
#pad{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-top:4px;user-select:none;-webkit-user-select:none;touch-action:none}
.dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px}
.pb{font:inherit;font-size:18px;color:var(--text);background:#141b4e;border:2px solid var(--edge);border-radius:8px;touch-action:none}
.pb:active,.pb.on{background:var(--sel);border-color:var(--rule)}
.ab{display:flex;gap:14px;align-items:center}
.ab .pb{width:66px;height:66px;border-radius:50%}
.ab .pb small{display:block;font-size:11px;color:var(--dim)}
@media (hover:hover) and (pointer:fine){#pad{display:none}}
@media (prefers-reduced-motion:reduce){.opt.hl::before{animation:none}}
footer{color:var(--dim);font-size:12px;text-align:center}
/* Expedition journal: compact HUD, readable controls, room for the world. */
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#172144 0,#070a1f 70%)}
#app{max-width:1120px;padding-top:18px}
.masthead{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--dim);font-size:12px;letter-spacing:.12em}
.masthead strong{color:var(--gold);font-size:19px;letter-spacing:.18em}
#saveStatus{letter-spacing:0;font-size:11px;text-align:right}
#screen{border-color:#7f8db5;box-shadow:0 0 0 1px #263452,0 15px 40px #0006}
.opt{border:1px solid #39407a;min-height:48px;padding-top:10px;padding-bottom:10px}
.opt.hl{border-color:var(--gold)}.mini{min-height:36px}.hbtn{min-height:40px}
.resource{min-width:98px;flex:1}.resource small{display:block;font-size:11px;color:var(--dim)}
.meter{display:block;height:5px;margin-top:4px;background:#263052;border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--good)}.mana i{background:#91bfff}.xp i{background:var(--gold)}
.journal-list{list-style:none;padding:0;margin:10px 0}.journal-list li{padding:9px 0;border-bottom:1px solid var(--edge);color:var(--dim)}
.journal-list .current{color:var(--gold)}.journal-list .complete{color:var(--good)}
.learning-summary{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0}.learning-summary span{color:var(--dim);font-size:13px}.learning-summary b{color:var(--gold);font-size:20px}
.progress-note{color:var(--gold);font-size:13px;margin-bottom:8px}.nb td{overflow-wrap:anywhere}
#panel{min-width:0}#log{min-height:0}footer{line-height:1.8}
@media(min-width:900px){#app{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:14px;align-items:start}.masthead,footer{grid-column:1/-1}#screen{grid-column:1;grid-row:2}#hud{grid-column:1;grid-row:3}#panel{grid-column:2;grid-row:2 / 4;height:100%;max-height:640px}#log{flex:1;max-height:none;overflow:auto}#opts{grid-template-columns:1fr}#pad{grid-column:1/-1}}
@media(max-width:420px){#app{padding:10px 10px 20px;gap:9px}.masthead{font-size:10px}.masthead strong{font-size:15px}#panel{padding:10px;min-height:150px}.en{font-size:16px}.big{font-size:24px}#opts{grid-template-columns:1fr 1fr}.opt{font-size:14px;padding-left:22px}.opt.hl::before{left:6px}.dpad{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px)}.ab{gap:10px}.ab .pb{width:56px;height:56px}#hud{gap:6px}.resource{min-width:78px}.nb{font-size:12px}}
@media(max-width:899px),(pointer:coarse){#pad{display:flex}}
@media(max-width:420px){#hudStats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 8px}#hudStats>span:first-child{grid-column:1 / 3}#hudStats>span:last-child{grid-column:3;grid-row:1}.resource{min-width:0}.resource small{font-size:10px}.hbtn{font-size:13px;padding:2px 8px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;scroll-behavior:auto!important}}
</style>

<div id="app">
  <header class="masthead"><div><strong>LEXI QUEST</strong> / ことばの幻界</div><span id="saveStatus" role="status">冒険の準備</span></header>
  <div id="screen"><canvas id="gl" aria-hidden="true"></canvas><canvas id="cv" width="480" height="352" aria-label="ゲーム画面"></canvas></div>
  <div id="hud"><div id="hudStats"></div><button class="hbtn" id="menuBtn" type="button">メニュー</button></div>
  <div id="panel" class="win" aria-live="polite">
    <div id="log"></div>
    <div id="opts"></div>
  </div>
  <div id="pad">
    <div class="dpad">
      <span></span><button class="pb" data-d="0" type="button" aria-label="上">▲</button><span></span>
      <button class="pb" data-d="3" type="button" aria-label="左">◀</button><span></span><button class="pb" data-d="1" type="button" aria-label="右">▶</button>
      <span></span><button class="pb" data-d="2" type="button" aria-label="下">▼</button><span></span>

  <footer>移動: 矢印/WASD ・ 決定/話す: Z・Enter・Space ・ メニュー/戻る: X・Esc ・ 1–4: 解答 ・ R: もう一度聞く ・ J: 訳</footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
const $=s=>document.querySelector(s);
const cv=$('#cv'), ctx=cv.getContext('2d');
const logEl=$('#log'), optsEl=$('#opts'), hudEl=$('#hudStats');
const TS=32, VW=15, VH=11, MOVE=140;
const DX=[0,1,0,-1], DY=[-1,0,1,0];

/* ================= LEARNING DATA ================= */
const VRAW={
1:"apple|りんご,river|川,mountain|山,bridge|橋,village|村,sword|剣,shield|盾,key|鍵,door|ドア,window|窓,friend|友達,enemy|敵,brave|勇敢な,hungry|お腹がすいた,tired|疲れた,strong|強い,weak|弱い,cheap|安い,expensive|(値段が)高い,forest|森,cave|洞窟,map|地図,king|王,castle|城,cloud|雲,dream|夢,light|光,dark|暗い,quiet|静かな,water|水,fire|火,road|道,town|町,heavy|重い,early|早い",
2:"borrow|借りる,lend|貸す,journey|旅,treasure|宝物,ancient|古代の,dangerous|危険な,rescue|救助する,protect|守る,merchant|商人,harbor|港,voyage|航海,weather|天気,recover|回復する,defeat|打ち負かす,escape|逃げる,whisper|ささやく,courage|勇気,promise|約束,reward|報酬,deliver|届ける,guard|見張り,curious|好奇心の強い,forgive|許す,gather|集める,prepare|準備する,lighthouse|灯台,scholar|学者,island|島,announce|知らせる,shelter|避難所",
3:"reluctant|気が進まない,inevitable|避けられない,abandon|見捨てる,consequence|結果,reveal|明らかにする,ominous|不吉な,persuade|説得する,endure|耐える,vanish|消える,illusion|幻,legendary|伝説の,sacrifice|犠牲,prophecy|予言,distinguish|区別する,obscure|不明瞭な,alliance|同盟,wisdom|知恵,betray|裏切る,restore|元に戻す,eternal|永遠の,silence|沈黙,fragile|壊れやすい,tremble|震える,summon|呼び出す,ruin|廃墟,nightmare|悪夢,mirror|鏡,drift|漂う,reflect|映す,hesitate|ためらう,threshold|入り口,fade|薄れる,awaken|目覚める"};
const VOCAB=[]; for(const t in VRAW) for(const p of VRAW[t].split(',')){const [en,ja]=p.split('|');VOCAB.push([+t,en,ja]);}
const GLOSS="crystal|水晶,shard|かけら,piece|かけら,careful|注意深い,elder|長老,broke|壊れた(breakの過去),hope|希望,herb|薬草,inn|宿屋,pass|通る,cross|渡る,halt|止まれ,grammar|文法,rule|規則,ready|準備ができた,duel|決闘,ship|船,pier|桟橋,announcement|お知らせ,attention|注意,tower|塔,southwest|南西,southeast|南東,east|東,awake|目が覚めて,forget|忘れる,slowly|ゆっくり,speak|話す,listen|聞く,carefully|注意深く,monster|怪物,strange|奇妙な,force|力,peace|平和,lie|うそ,pain|痛み,argument|口論,friendship|友情,traveler|旅人,room|部屋,night|夜,stay|泊まる,welcome|歓迎する,sailor|船乗り,question|質問,answer|答える,correct|正しい,meaning|意味,practice|練習,test|試す,word|言葉,language|言語,legend|伝説,warm|温かい,noisy|うるさい,safe|安全な,study|勉強する,discount|割引,poet|詩人,lost|失われた,ghost|幽霊,heal|癒やす,sound|音,similar|似ている,tip|助言,wind|風,passenger|乗客,ticket|切符,noon|正午,cancel|中止する,island|島,warrior|戦士,trial|試練";
const DICT={}; for(const v of VOCAB) DICT[v[1].toLowerCase()]=v[2]; for(const p of GLOSS.split(',')){const [en,ja]=p.split('|'); if(!DICT[en]) DICT[en]=ja;}

const GRAMMAR=[
[1,"I ___ a traveler.",["am","is","are","be"],"主語が I のとき be動詞は am。","私は旅人です。"],
[1,"She ___ to the market every day.",["goes","go","going","gone"],"三人称単数・現在形の動詞には -s/-es がつく。","彼女は毎日市場へ行く。"],
[1,"There ___ two dragons in the cave.",["are","is","am","be"],"There is/are の後ろが複数なら are。","洞窟には2匹の竜がいる。"],
[1,"___ you like apples?",["Do","Does","Are","Is"],"一般動詞の疑問文。主語が you なら Do。","りんごは好きですか？"],
[1,"He ___ swim very well.",["can","cans","can to","is can"],"助動詞 can の後は動詞の原形。can の形は変わらない。","彼はとても上手に泳げる。"],
[1,"This is ___ sword.",["my","I","me","mine"],"名詞の前には所有格 my。","これは私の剣です。"],
[1,"I have ___ apple.",["an","a","two","many"],"母音の音で始まる語の前は an。","りんごを1つ持っている。"],
[1,"Look! The bird ___ flying.",["is","are","does","do"],"現在進行形は be + -ing。bird は単数なので is。","見て！鳥が飛んでいる。"],
[1,"We ___ very tired yesterday.",["were","are","was","be"],"yesterday → 過去。we の be動詞の過去形は were。","私たちは昨日とても疲れていた。"],
[1,"Where ___ the inn?",["is","are","does","do"],"the inn は単数なので is。","宿屋はどこですか？"],
[1,"He ___ not like spiders.",["does","do","is","are"],"三人称単数の否定文は does not + 原形。","彼はクモが好きではない。"],
[1,"I ___ my key yesterday.",["lost","lose","losing","loses"],"yesterday があるので過去形 lost。","昨日鍵をなくした。"],
[2,"I ___ to the castle last year.",["went","go","have gone","going"],"last year は過去の一点 → 過去形。現在完了とは一緒に使わない。","去年城へ行った。"],
[2,"I have ___ finished my homework.",["already","yet","ago","since"],"肯定文の現在完了で「もう」は already。yet は疑問・否定文で使う。","もう宿題を終えた。"],
[2,"If it rains tomorrow, I ___ stay home.",["will","would","am","did"],"条件を表す If 節は現在形、主節は will。","明日雨なら家にいる。"],
[2,"This tower is ___ than that one.",["taller","tall","tallest","more tall"],"比較級 -er + than。","この塔はあの塔より高い。"],
[2,"The key was ___ by a thief.",["stolen","stole","steal","stealing"],"受け身は be + 過去分詞。steal-stole-stolen。","鍵は泥棒に盗まれた。"],
[2,"I'm looking forward to ___ you.",["seeing","see","saw","seen"],"look forward to の to は前置詞 → 後ろは -ing。","会えるのを楽しみにしている。"],
[2,"She is the girl ___ saved the king.",["who","which","whose","what"],"先行詞が人で、主語の働き → who。","彼女は王を救った少女だ。"],
[2,"You ___ wear armor in the cave.",["should","should to","shoulds","had"],"should + 動詞の原形。","洞窟では鎧を着るべきだ。"],
[2,"I have lived here ___ ten years.",["for","since","during","from"],"期間の長さには for、起点には since。","ここに10年住んでいる。"],
[2,"He asked me ___ help him.",["to","for","that","of"],"ask + 人 + to do「人に〜するよう頼む」。","彼は私に手伝ってと頼んだ。"],
[2,"The ship is ___ big to enter the harbor.",["too","so","very","enough"],"too 〜 to do「〜すぎて…できない」。","その船は大きすぎて港に入れない。"],
[2,"Have you ever ___ a dragon?",["seen","saw","see","seeing"],"経験の現在完了：have + 過去分詞。","竜を見たことがありますか？"],
[3,"If I ___ wings, I would fly to the tower.",["had","have","will have","has"],"仮定法過去：If + 過去形, would + 原形。","もし翼があれば塔まで飛ぶのに。"],
[3,"By the time we arrived, the ship ___ left.",["had","has","have","was"],"過去のある時点より前の完了 → 過去完了 had + 過去分詞。","着いた時には船はもう出ていた。"],
[3,"I wish I ___ speak to dragons.",["could","can","will","am able"],"I wish + 仮定法過去（could）。","竜と話せたらいいのに。"],
[3,"The man ___ house burned down asked for help.",["whose","who","which","that"],"「その人の家」→ 所有格の関係代名詞 whose。","家が焼けた男が助けを求めた。"],
[3,"Not only ___ brave, but she is also wise.",["is she","she is","does she","she does"],"否定の語句 Not only が文頭 → 倒置。","彼女は勇敢なだけでなく賢い。"],
[3,"I'd rather you ___ tell anyone.",["didn't","don't","won't","not"],"would rather + 主語 + 過去形（仮定法）。","誰にも言わないでほしい。"],
[3,"Had I known, I ___ have come earlier.",["would","will","should to","had"],"If I had known の倒置。主節は would have + 過去分詞。","知っていたらもっと早く来たのに。"],
[3,"The bridge is said ___ built 500 years ago.",["to have been","to be","being","to have"],"述語より前の出来事 → 完了不定詞。受け身なので to have been。","その橋は500年前に建てられたと言われる。"],
[3,"It's high time we ___ home.",["went","go","will go","going"],"It's (high) time + 過去形「もう〜すべき時だ」。","もう帰るべき時間だ。"],
[3,"Hardly ___ he arrived when the alarm rang.",["had","has","did","was"],"Hardly had S + 過去分詞 when …「〜するやいなや」（倒置）。","彼が着くやいなや警報が鳴った。"],
[3,"She speaks as if she ___ everything.",["knew","knows","know","has known"],"as if + 仮定法過去で「まるで〜かのように」。","彼女はまるで全部知っているかのように話す。"],
[3,"Never ___ I seen such a huge tower.",["have","had","did","do"],"Never が文頭 → 倒置 have I seen。","こんなに巨大な塔は見たことがない。"],
[3,"The more you practice, the ___ you become.",["better","good","best","well"],"The 比較級, the 比較級「〜すればするほど…」。","練習すればするほど上手になる。"],
[3,"She suggested that he ___ a doctor.",["see","sees","saw","seeing"],"suggest that S + (should) 原形（仮定法現在）。","彼女は彼に医者に診てもらうよう勧めた。"],
[3,"___ the rain, we continued the journey.",["Despite","Although","Because","However"],"Despite + 名詞（Although は節をとる）。","雨にもかかわらず旅を続けた。"],
[3,"I regret ___ you the truth earlier.",["not telling","not to tell","to not tell","don't telling"],"regret + -ing「〜したことを後悔する」。","もっと早く真実を話さなかったことを後悔している。"],
[3,"No sooner had we left ___ it began to rain.",["than","when","then","that"],"No sooner … than …「〜するとすぐに…」。","出発するとすぐ雨が降り出した。"],

function charGrid(dir,frame,mods){
 const side=dir===1||dir===3;let g;
 if(!side){g=(dir===2?CH.down:CH.up).map(r=>(r+[...r].reverse().join('')).split(''));
  if(frame){const a=frame===1?0:8;for(let x=a;x<a+8;x++)if(g[15][x]==='B'){g[14][x]='B';g[15][x]='.'}}}
 else{g=CH.side.map(r=>r.split(''));if(frame===1)for(let k=0;k<3;k++)g[13+k]=CH.walk[k].split('')}
 const set=(y,x,c,only)=>{if(g[y]&&g[y][x]!==undefined&&(!only||only.includes(g[y][x])))g[y][x]=c};
 for(const m of mods){
  if(m==='robe'){const [a,b]=side?[5,11]:[4,12];for(let y=13;y<15;y++)for(let x=a;x<b;x++)set(y,x,'T','L.')}
  if(m==='beard'){if(dir===2)for(let y=6;y<9;y++)for(let x=5;x<11;x++)set(y,x,'W','ST');if(side)for(let y=6;y<9;y++)for(let x=3;x<8;x++)set(y,x,'W','S')}
  if(m==='longhair'){if(dir===2){for(let y=5;y<9;y++){set(y,2,'H');set(y,13,'H')}for(let y=6;y<9;y++){set(y,3,'H','.S');set(y,12,'H','.S')}}
   if(dir===0)for(let y=7;y<11;y++)for(let x=4;x<12;x++)set(y,x,'H','ST');if(side)for(let y=6;y<11;y++)for(let x=8;x<12;x++)set(y,x,'H','.T')}
  if(m==='helm'){set(0,7,'A');set(0,8,'A')}
  if(m==='hat'){for(let y=0;y<2;y++)for(let x=0;x<16;x++)set(y,x,'K','H');const [a,b]=side?[3,14]:[1,15];for(let x=a;x<b;x++)set(2,x,'K')}
  if(m==='cape'){if(dir===0)for(let y=8;y<13;y++)for(let x=3;x<13;x++)set(y,x,'C');
   if(side)for(let y=8;y<13;y++)for(let x=11;x<13;x++)set(y,x,'C','.');
   if(dir===2)for(let y=11;y<13;y++)for(const x of [2,3,12,13])set(y,x,'C','.')}
  if(m==='ghost'){for(let y=13;y<16;y++)for(let x=0;x<16;x++)set(y,x,'.');for(let x=0;x<16;x++)set(12,x,'T','A')}
 }
 return g}

// Pixel baking: auto outline + light from the top-left
function hexRgb(h){h=h.replace('#','');if(h.length===3)h=[...h].map(c=>c+c).join('');const n=parseInt(h,16);return [n>>16&255,n>>8&255,n&255]}
function shadeHex(h,f){const [r,g,b]=hexRgb(h);const k=v=>Math.max(0,Math.min(255,Math.round(f>1?v+(255-v)*(f-1):v*f)));return `rgb(${k(r)},${k(g)},${k(b)})`}
const NOSHADE='E2M';
function bake(g,pal,o={}){
 const h=g.length,w=g[0].length,c=document.createElement('canvas');c.width=w+2;c.height=h+2;const x=c.getContext('2d');
 const col=(i,j)=>j>=0&&j<h&&i>=0&&i<w?pal[g[j][i]]:null;
 x.fillStyle=o.outline||'#130e24';
 for(let j=-1;j<=h;j++)for(let i=-1;i<=w;i++)if(!col(i,j)&&(col(i-1,j)||col(i+1,j)||col(i,j-1)||col(i,j+1)))x.fillRect(i+1,j+1,1,1);
 for(let j=0;j<h;j++)for(let i=0;i<w;i++){const m=g[j][i],cc=pal[m];if(!cc)continue;
  if(o.flat){x.fillStyle=o.flat;x.fillRect(i+1,j+1,1,1);continue}
  let f=1;if(!NOSHADE.includes(m)){
   if(!col(i+1,j)||!col(i,j+1))f=0.7;else if(!col(i-1,j)||!col(i,j-1))f=1.24;
   else if(g[j][i+1]!==m||g[j+1][i]!==m)f=0.86;
   f*=1-0.14*(j/h)}
  x.fillStyle=shadeHex(cc,f);x.fillRect(i+1,j+1,1,1)}
 return c}

function charCanvas(k,dir,frame){const side=dir===1||dir===3;if(side&&frame===2)frame=0;const key='c:'+k+':'+dir+':'+frame;
 if(!SPRC.has(key)){const d=CHARS[k];let c=bake(charGrid(side?3:dir,frame,d.mods||[]),Object.assign({E:'#1b1630',W:'#f4f4f8'},d.pal));
  if(dir===1){const [f,fx]=cnv(c.width,c.height);fx.translate(c.width,0);fx.scale(-1,1);fx.drawImage(c,0,0);c=f}SPRC.set(key,c)}return SPRC.get(key)}

const rnd=n=>Math.floor(Math.random()*n), pick=a=>a[rnd(a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function mk(c,wr){const arr=shuffle([c,...wr]);return {choices:arr,correct:arr.indexOf(c)}}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function hash(x,y){let h=(x*374761393+y*668265263)|0;h=(h^(h>>>13))*1274126177|0;return (h^(h>>>16))>>>0}
function lookup(w){let k=w.toLowerCase().replace(/'s$/,'');if(DICT[k])return DICT[k];
 for(const s of ['s','es','ed','d','ing','ly'])if(k.endsWith(s)&&DICT[k.slice(0,-s.length)])return DICT[k.slice(0,-s.length)];return null}
function wordify(s){return s.replace(/[A-Za-z']+/g,w=>{const m=lookup(w);return m?`<span class="w" data-m="${m}" data-w="${w}">${w}</span>`:w})}

 voice=vs.find(v=>/^en[-_]US/i.test(v.lang)&&/Google|Samantha|Aria|Jenny|Zira|Natural/i.test(v.name))||vs.find(v=>/^en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null}
if(TTS){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function speak(t,slow){if(!TTS||!t)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(voice)u.voice=voice;u.rate=slow?0.6:opt.rate;speechSynthesis.speak(u)}catch(e){}}

 return new Promise(res=>{
  optsEl.innerHTML='';nav.readyAt=performance.now()+140;nav.cancel=o.cancel;
  const done=v=>{nav.btns=[];nav.done=null;nav.cancel=undefined;optsEl.innerHTML='';res(v)};
  nav.btns=items.map((it,i)=>{const b=document.createElement('button');b.type='button';b.className='opt '+(it.cls||'');b.innerHTML=it.label;b.disabled=!!it.disabled;
   b.onclick=()=>{if(b.disabled||performance.now()<nav.readyAt)return;done(it.value!==undefined?it.value:i)};
   b.onmouseenter=()=>{if(!b.disabled){nav.i=i;hl()}};optsEl.appendChild(b);return b});
  nav.i=Math.max(0,nav.btns.findIndex(b=>!b.disabled));nav.done=done;hl();
 });
}

 return new Promise(res=>{const t0=performance.now();let fin=false;const f=()=>{if(fin)return;fin=true;skipper=null;res()};

const audioBtns=`<div class="tools"><button class="mini" data-say type="button">▶ Play</button><button class="mini" data-slow type="button">▶ Slow</button></div>`;
function qVocab(t,w){const pool=VOCAB.filter(v=>v[0]===t);w=w||pick(pool);const others=shuffle(pool.filter(v=>v!==w)).slice(0,3);
 const ej=Math.random()<.6;const m=ej?mk(w[2],others.map(o=>o[2])):mk(w[1],others.map(o=>o[1]));
 return {type:'vocab',label:'VOCAB 単語',cls:'',prompt:ej?`<div class="big">${w[1]}</div><div class="sub">意味は？ What does it mean?</div>`:`<div class="big">${w[2]}</div><div class="sub">英語では？ Which English word?</div>`,
  say:ej?w[1]:null,after:w[1],...m,explain:`<p class="en"><b>${w[1]}</b> = ${w[2]}</p>`,key:'v:'+w[1],en:w[1],ja:w[2]}}
function qGrammar(t,g){g=g||pick(GRAMMAR.filter(x=>x[0]===t));const m=mk(g[2][0],g[2].slice(1));const filled=g[1].replace('___',g[2][0]);
 return {type:'grammar',label:'GRAMMAR 文法',cls:'g',prompt:`<p class="en">${g[1].replace('___','<span class="blank">　?　</span>')}</p><div class="sub">空所に入るのは？</div>`,
  after:filled,...m,explain:`<p class="en">${filled.replace(g[2][0],`<b class="dmg">${g[2][0]}</b>`)}</p><p class="ja">${g[4]}</p><p class="tipline">💡 ${g[3]}</p>`.replace('💡','▸'),key:'g:'+g[1],en:filled,ja:g[4]}}
function qListen(t,l,mode){const pool=LISTEN.filter(x=>x[0]===t);l=l||pick(pool);mode=mode||(Math.random()<.5?'heard':'meaning');
 const others=shuffle(pool.filter(x=>x!==l)).slice(0,3);const m=mode==='heard'?mk(l[1],others.map(o=>o[1])):mk(l[2],others.map(o=>o[2]));
 return {type:'listen',label:'LISTENING リスニング',cls:'l',prompt:`<div class="sub">${mode==='heard'?'聞こえた英文はどれ？ Which sentence did you hear?':'意味はどれ？ What does it mean?'}</div>${TTS?audioBtns:`<p class="tipline">（音声が使えない環境です。<span class="spoil">${l[1]}</span> をタップして表示）</p>`}`,
  say:l[1],after:l[1],...m,explain:`<p class="en">${wordify(l[1])}</p><p class="ja">${l[2]}</p>`,key:'l:'+l[1],en:l[1],ja:l[2]}}
function qMinimal(set,w){set=set||pick(MINIMAL);w=w||pick(set);const m=mk(w,set.filter(x=>x!==w));
 return {type:'minimal',label:'SOUNDS 発音',cls:'m',prompt:`<div class="sub">どの単語が聞こえた？ Which word did you hear?</div>${TTS?audioBtns:`<p class="tipline"><span class="spoil">${w}</span></p>`}`,
  say:w,after:w,...m,explain:`<p class="en">You heard: <b>${w}</b></p><p class="tipline">似た音: ${set.filter(x=>x!==w).join(' / ')}（▶で聞き比べよう）</p>`,key:'m:'+w,en:w,ja:'似た音: '+set.filter(x=>x!==w).join(', ')}}
function qConvo(c,who){c=c||pick(CONVO.filter(x=>!x.tag));const m=mk(c.a[0],c.a.slice(1));
 return {type:'convo',label:'TALK 会話',cls:'c',prompt:`${who?`<div class="who">${who}</div>`:''}<p class="en">“${wordify(c.q)}”</p><p class="ja"${opt.sub?'':' hidden'}>${c.qja}</p><div class="sub">いちばん自然な返事は？ Choose the best reply.</div>${TTS?'<div class="tools"><button class="mini" data-say type="button">▶ Play</button></div>':''}`,
  say:c.q,after:c.a[0],...m,explain:`<p class="en">“${c.q}” → <b>${c.a[0]}</b></p><p class="tipline">▸ ${c.tip}</p>`,key:'c:'+c.q,en:c.q+' → '+c.a[0],ja:c.qja}}
function qListenAny(t){if(t<3&&Math.random()<(t===1?.4:.25))return qMinimal();return qListen(t)}
function qFromKey(k){const i=k.indexOf(':'),t=k.slice(0,i),s=k.slice(i+1);
 if(t==='v'){const v=VOCAB.find(v=>v[1]===s);return v&&qVocab(v[0],v)}
 if(t==='g'){const g=GRAMMAR.find(g=>g[1]===s);return g&&qGrammar(g[0],g)}
 if(t==='l'){const l=LISTEN.find(l=>l[1]===s);return l&&qListen(l[0],l)}
 if(t==='m'){const m=MINIMAL.find(m=>m.includes(s));return m&&qMinimal(m,s)}
 if(t==='c'){const c=CONVO.find(c=>c.q===s);return c&&qConvo(c)}}
function record(Q,ok){
 S.stats[ok?'right':'wrong']++;if(!Q.key)return;
 const n=S.notebook[Q.key]||(S.notebook[Q.key]={en:Q.en,ja:Q.ja,type:Q.type,r:0,w:0});
 ok?n.r++:n.w++;n.streak=ok?(n.streak||0)+1:0;n.last=Date.now();
}
function needsReview(n){return n.w>0&&(Number.isFinite(n.streak)?n.streak<2:n.w>n.r||n.r<2)}
function reviewList(){return Object.entries(S.notebook).filter(([,n])=>needsReview(n)).sort((a,b)=>(b[1].w-b[1].r)-(a[1].w-a[1].r))}

async function quiz(Q,o={}){
 setLog(`${o.progress?`<div class="progress-note">復習 ${o.progress}</div>`:''}<span class="qtag ${Q.cls}">${Q.label}</span>${Q.prompt}`,Q.say||'');
 if(Q.say)setTimeout(()=>speak(Q.say),120);
 const idx=await ask(Q.choices.map((c,i)=>({label:`${i+1}. ${c}`,value:i})));
 const ok=idx===Q.correct;record(Q,ok);
 const head=ok?`<div class="ok">◎ Correct!${o.battle?' 正解！':''}</div>`:`<div class="ng">× Not quite… 答え: ${Q.choices[Q.correct]}</div>`;
 const body=`${head}${Q.explain}${TTS?'<div class="tools"><button class="mini" data-say type="button">♪ Listen</button><button class="mini" data-slow type="button">♪ Slow</button></div>':''}`;
 if(ok&&o.battle&&!opt.waitAnswer){await beat(body,1300,Q.after)}else{setLog(body,Q.after);if(opt.auto&&Q.after&&Q.type!=='listen'&&Q.type!=='minimal')speak(Q.after);await next()}
 return ok;
}

async function shop(who,stock){
 const ok=await quiz(qConvo(pick(CONVO.filter(c=>c.tag==='shop')),who));
 const disc=ok?0.8:1;
 await say(who,ok?"What a polite customer! Everything is 20% off for you.":"Er... okay. Take a look.",ok?"なんて丁寧なお客さん！全部2割引きにするよ。":"えーと…まあ、見ていってね。");
 while(true){
  setLog(`<div class="who">${who}</div><p class="en">${wordify("What would you like?")}</p><p class="sub">所持金 ${S.gold}G ・ 武器 ${S.weapon.n} ・ 防具 ${S.armor.n}</p>`,"What would you like?");
  const it=await ask([...stock.map(s=>({label:`${s.n}<small>${s.d} ・ ${Math.ceil(s.p*disc)}G</small>`,value:s})),{label:'Leave<small>店を出る</small>',value:null}],{cancel:null});
  if(!it)break;const price=Math.ceil(it.p*disc);
  if(S.gold<price){await say(who,"Sorry, you don't have enough money.","ごめんね、お金が足りないみたい。");continue}
  if(it.kind==='item'){S.items[it.id]++;S.gold-=price;await say(who,"Here you are. Thank you!","はい、どうぞ。ありがとう！");continue}
  const slot=it.kind==='weapon'?'weapon':'armor';
  if(S[slot].v>=it.v){await say(who,"You already have something better.","もっといい物を持っているみたいだね。");continue}
  S.gold-=price;S[slot]={n:it.n.split(' ').slice(0,2).join(' '),v:it.v};await say(who,"It looks great on you!","よく似合ってるよ！");
 }
 await say(who,"Thank you. Come again!","ありがとう。また来てね！");
}

let B=null;
function zoneKey(){const m=MAPS[S.map];if(m.zone)return m.zone;return S.x<=21?'w1':'w2'}
function curTier(){return opt.tier||(B?B.tier:ZONES[zoneKey()].tier)}
async function battle(key){
 const E0=ENEMIES[key];const zk=zoneKey();const z=ZONES[zk];
 B={key,E:{...E0,max:E0.hp},tier:E0.tier||z.tier,zone:z,hitT:0,hurtT:0,atkT:0,big:0,nums:[],dead:0,combo:0,turn:0,t0:performance.now()};
 const En=B.E;mode='battle';
 await beat(`<p class="en"><b>${En.name}</b> appears!</p><p class="ja">${En.jp}が あらわれた！</p>`,1300);
 while(true){
  const t=curTier();
  setLog(`<p class="en">Command?</p><p class="sub">${B.combo>1?`<span class="dmg">${B.combo} COMBO!</span> 連続正解でダメージアップ ・ `:''}問題レベル ${t}</p>`);
  const cmd=await ask([{label:'Attack<small>単語 Vocabulary</small>',value:'atk'},{label:`Spell<small>文法 Grammar ・ MP ${spellCost()}</small>`,value:'spl',disabled:S.mp<spellCost()},
   {label:'Echo<small>リスニング ・ HP少し回復</small>',value:'lis'},{label:'Item<small>どうぐ</small>',value:'item'},{label:'Run<small>にげる</small>',value:'run',disabled:!!En.boss}]);
  if(cmd==='item'){if(!await itemMenu(true))continue}
  else if(cmd==='run'){if(Math.random()<.7){await beat('<p class="en">You ran away!</p><p class="ja">うまく逃げ切った！</p>',1000);endBattle();return 'run'}
   await beat("<p class=\"en\">You couldn't escape!</p><p class=\"ja\">逃げられない！</p>",1000)}
  else{
   let Q,mult=1,verb='You strike';
   if(cmd==='atk')Q=qVocab(t);
   if(cmd==='spl'){S.mp-=spellCost();Q=qGrammar(t);mult=1.8;verb='Syntax Flare bursts'}
   if(cmd==='lis'){Q=qListenAny(t);mult=1.3;verb='Echo Wave hits'}
   const jm=(cmd==='atk'&&S.job==='scribe')?1.4:(cmd==='spl'&&S.job==='sage')?1.4:(cmd==='lis'&&S.job==='hunter')?1.5:1;
   const ok=await quiz(Q,{battle:true});
   if(ok){B.combo++;const cb=1+Math.min(B.combo-1,4)*0.15;const d=Math.max(1,Math.round(atk()*(0.9+Math.random()*0.2)*mult*jm*cb));
    En.hp=Math.max(0,En.hp-d);B.hitT=performance.now();B.fx={k:cmd,t:performance.now(),parts:Array.from({length:28},()=>({a:Math.random()*6.283,s:60+Math.random()*110,c:pick(["#ffd25e","#ff9a3c","#ffffff","#ff5a3c"]),z:pick([4,6,8])}))};B.nums.push({v:d,t:performance.now()});

 mt.forEach(([x,y,cv],i)=>{const r=srand(hash(x,y)+7),s=cv?1.3:.85+r()*.35,sh=cv?1.5:.75+r()*.75,rot=r()*6,jx=(r()-.5)*.2,jz=(r()-.5)*.2;

function torches(sc,m,W,H,at,mid){
 const spots=[];for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++)if(at(x,y)==='#'&&at(x,y+1)==='o')spots.push([x,y,hash(x,y)]);
 spots.sort((a,b)=>a[2]-b[2]);const pick2=[];for(const s of spots){if(pick2.every(q=>Math.abs(q[0]-s[0])+Math.abs(q[1]-s[1])>5))pick2.push(s);if(pick2.length>=(mid==='tower'?5:3))break}
 const fl=sprTex(flameCanvas()),fns=[];
 for(const [x,y] of pick2){const b=new THREE.Mesh(new THREE.BoxGeometry(.08,.22,.1),stdMat('brk',{color:'#3a2a1e'}));b.position.set(x,.62,y+.53);sc.add(b);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:fl,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true}));sp.center.set(.5,0);sp.position.set(x,.72,y+.58);sp.scale.set(.32,.46,1);sc.add(sp);
  const l=new THREE.PointLight(mid==='tower'?'#c890ff':'#ff9a40',1.1,4.8,1.7);l.position.set(x,.95,y+.85);sc.add(l);
  const ph=x*1.7+y;fns.push(now=>{const f=.85+Math.sin(now/70+ph)*.08+Math.sin(now/23+ph*2)*.06;l.intensity=1.1*f;sp.scale.set(.32*f,.46*(1.6-f*.6),1)})}
 if(mid==='cave'){const cs=[];for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++)if(at(x,y)==='o'&&at(x-1,y)==='#'&&at(x,y-1)==='#'&&hash(x,y)%3===0)cs.push([x,y]);
  cs.slice(0,3).forEach(([x,y],i)=>{const g=new THREE.OctahedronGeometry(.14,0),mt=new THREE.MeshStandardMaterial({color:'#7ef0ff',emissive:'#2bb8e0',emissiveIntensity:.9,flatShading:true,roughness:.2});
   for(let k=0;k<3;k++){const q=new THREE.Mesh(g,mt);q.position.set(x-.32+k*.12,.12+k*.04,y-.32+(k%2)*.1);q.scale.set(1,1.8+k*.4,1);q.rotation.z=(k-1)*.3;sc.add(q)}
   if(i<2){const l=new THREE.PointLight('#5fe0ff',.8,3.5,1.8);l.position.set(x-.2,.6,y-.1);sc.add(l)}})}
 return fns}

 if(!GL.rt){resizeGL();if(!GL.rt)return}
 const title=mode==='title'||!S,mid=title?'village':S.map,sc=getScene(mid);sc.update(now);
 const cam=GL.cam,T=GL.camT;

 else{const hp=heroPos(now);T.set(hp.rx,0,hp.ry);cam.position.set(T.x,8.6,T.z+8.8);cam.lookAt(T.x,.35,T.z-.6)}
 if(sc.sun){sc.sun.position.set(T.x+sc.sunOff[0],sc.sunOff[1],T.z+sc.sunOff[2]);sc.sun.target.position.copy(T)}
 if(sc.torch&&S&&!title){const hp=heroPos(now);sc.torch.position.set(hp.rx,1.3,hp.ry+.35);sc.torch.intensity=sc.torchI*(.93+Math.sin(now/90)*.04+Math.sin(now/37)*.03)}
